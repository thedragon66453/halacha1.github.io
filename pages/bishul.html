<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>בישול</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700&display=swap");

    :root {
      --bg: #f5f3ee;
      --card: #ffffff;
      --text: #222222;
      --muted: #666666;
      --primary: #2f5d8a;
      --radius: 12px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Heebo", "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 32px 16px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .back-link:hover { text-decoration: underline; }

    .page-card {
      background: var(--card);
      padding: 24px;
      border-radius: var(--radius);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.5rem;
    }

    .under-construction {
      text-align: center;
      font-size: 1.3rem;
      color: var(--muted);
      padding: 40px 0;
    }
  </style>
</head>
<body>
  <main class="container">
    <a class="back-link" href="../index.html">→ חזרה לדף הבית</a>

    <section class="page-card">
      <h1>בישול</h1>
      <p class="under-construction">תחת בנייה</p>
    </section>
  </main>
</body>
</html>
